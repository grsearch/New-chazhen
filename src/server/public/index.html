<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PumpSwap 砸单反弹矩阵</title>
  <style>
    :root { color-scheme:dark; --bg:#0b1014; --panel:#121a20; --line:#26333c; --text:#e7eef2; --muted:#8da0ac; --good:#50d890; --bad:#ff6b6b; --accent:#72b7ff; --warning:#ffbf69; }
    * { box-sizing:border-box; }
    body { margin:0; font:14px/1.45 Inter,Segoe UI,sans-serif; background:var(--bg); color:var(--text); }
    main { max-width:1540px; margin:auto; padding:24px; }
    header { display:flex; justify-content:space-between; gap:16px; align-items:end; margin-bottom:20px; }
    h1 { font-size:24px; margin:0; }
    h2 { font-size:16px; margin:0; }
    p { color:var(--muted); margin:6px 0 0; }
    .badge { padding:6px 10px; border:1px solid var(--line); border-radius:999px; color:var(--good); white-space:nowrap; }
    .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; margin-bottom:18px; }
    .card,.panel { background:var(--panel); border:1px solid var(--line); border-radius:12px; }
    .card { padding:14px; }
    .label { color:var(--muted); font-size:12px; }
    .value { font-size:23px; margin-top:5px; font-variant-numeric:tabular-nums; }
    .panel { padding:16px; margin-bottom:18px; overflow:hidden; }
    .panel-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px; }
    .sort-note { color:var(--muted); font-size:12px; }
    .table-wrap { overflow:auto; }
    table { width:100%; border-collapse:collapse; white-space:nowrap; }
    th,td { padding:9px 10px; border-bottom:1px solid var(--line); text-align:right; font-variant-numeric:tabular-nums; }
    th:first-child,td:first-child { text-align:left; }
    th { color:var(--muted); font-size:12px; font-weight:500; }
    code { color:var(--accent); }
    .good { color:var(--good); }
    .bad { color:var(--bad); }
    .warning { color:var(--warning); }
    .notice { color:var(--muted); }
    .notice strong { color:var(--text); }
    .sample { margin-left:7px; font-size:11px; color:var(--warning); }
    .token-link { color:var(--accent); text-decoration:none; border-bottom:1px dashed #4b7ead; }
    .token-link:hover { color:#a8d4ff; border-bottom-style:solid; }
    .rank { color:var(--muted); display:inline-block; min-width:30px; }
    .pager { min-height:38px; display:flex; align-items:center; justify-content:flex-end; gap:8px; padding-top:12px; color:var(--muted); }
    .pager button { border:1px solid var(--line); border-radius:8px; padding:6px 10px; color:var(--text); background:#18232b; cursor:pointer; }
    .pager button:hover:not(:disabled) { border-color:var(--accent); color:var(--accent); }
    .pager button:disabled { opacity:.35; cursor:not-allowed; }
    .pager-info { min-width:180px; text-align:center; font-variant-numeric:tabular-nums; }
    .empty { color:var(--muted); text-align:center!important; padding:28px!important; }
    @media (max-width:700px) { main{padding:14px} header,.panel-head{align-items:start;flex-direction:column}.pager{justify-content:center;flex-wrap:wrap}.pager-info{order:-1;width:100%} }
  </style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>PumpSwap 迁移后砸单反弹矩阵</h1>
      <p>全网监控 · AGE不限 · 砸单≥5 SOL · 冲击跌幅≥8% · 每个策略仓位固定1 SOL</p>
    </div>
    <div class="badge" id="status">读取中</div>
  </header>
  <section class="cards" id="cards"></section>
  <section class="panel notice" id="research-notice">正在读取直接砸单矩阵…</section>
  <section class="panel">
    <div class="panel-head"><h2>直接砸单策略矩阵</h2><span class="sort-note">仅 PUMPSWAP_DIRECT_DUMP_MANAGED_V1 · 胜率 ↓ · 平均净收益 ↓</span></div>
    <div class="table-wrap"><table id="strategies"></table></div><div class="pager" id="strategy-pager"></div>
  </section>
  <section class="panel">
    <div class="panel-head"><h2>最近达标砸单</h2><span class="sort-note">只显示达到5 SOL和8%双门槛的事件</span></div>
    <div class="table-wrap"><table id="dumps"></table></div><div class="pager" id="dump-pager"></div>
  </section>
</main>
<script>
const PAGE_SIZE=20;
const state={strategyPage:1,dumpPage:1,cohorts:[]};
let refreshInFlight=false;
let refreshQueued=false;
const html=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(v,d=2)=>v==null||!Number.isFinite(Number(v))?'—':Number(v).toFixed(d);
const pct=v=>v==null||!Number.isFinite(Number(v))?'—':`${fmt(v)}%`;
const cell=(v,c='')=>`<td class="${c}">${html(v==null?'—':v)}</td>`;
const metric=v=>v==null||v===''?null:(Number.isFinite(Number(v))?Number(v):null);
const time=v=>v==null?'—':new Date(v).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false});
const mintLink=mint=>{
  const value=String(mint||'');
  if(!value)return '—';
  const label=value.length>14?`${value.slice(0,8)}…${value.slice(-4)}`:value;
  return `<a class="token-link" href="https://gmgn.ai/sol/token/${encodeURIComponent(value)}" target="_blank" rel="noopener noreferrer" title="${html(value)}">${html(label)} ↗</a>`;
};
const compareMetric=(a,b)=>{
  const left=metric(a),right=metric(b);
  if(left==null&&right==null)return 0;
  if(left==null)return 1;
  if(right==null)return -1;
  return right-left;
};
const compareCohorts=(a,b)=>compareMetric(a.winRatePct,b.winRatePct)
  ||compareMetric(a.averageNetReturnPct,b.averageNetReturnPct)
  ||compareMetric(a.resolvedEpisodes??a.resolved,b.resolvedEpisodes??b.resolved)
  ||compareMetric(a.scheduled,b.scheduled);
const pageCount=total=>Math.max(1,Math.ceil(total/PAGE_SIZE));
function pager(id,kind,page,totalPages,total){
  const first=page<=1?'disabled':'';
  const last=page>=totalPages?'disabled':'';
  document.querySelector(id).innerHTML=`<button ${first} onclick="changePage('${kind}',1)">首页</button><button ${first} onclick="changePage('${kind}',${page-1})">上一页</button><span class="pager-info">第 ${page} / ${totalPages} 页 · 共 ${total} 条</span><button ${last} onclick="changePage('${kind}',${page+1})">下一页</button><button ${last} onclick="changePage('${kind}',${totalPages})">末页</button>`;
}
function signalLabel(id){
  const sizes={S:'5–10 SOL',M:'10–25 SOL',L:'≥25 SOL'};
  const drops={D8:'8–15%',D15:'15–30%',D30:'≥30%'};
  const match=/^DBM-([SML])-(D8|D15|D30)$/.exec(String(id||''));
  return match?`${sizes[match[1]]} / 跌${drops[match[2]]}`:(id||'—');
}
function entryLabel(id){
  return ({E0:'紧跟砸单后的首个可成交报价',E100:'延迟100ms',E300:'延迟300ms'})[id]||id||'—';
}
function exitLabel(id){
  const match=/^TP(\d+)-TR(\d+)D(\d+)-H(\d+)-(SLN|SLN(\d+))$/.exec(String(id||''));
  if(!match)return id||'—';
  const stop=match[5]==='SLN'?'无固定止损':`止损-${match[6]}%`;
  const hold=Number(match[4])>=60?`${Number(match[4])/60}分钟`:`${match[4]}秒`;
  return `5秒内+${match[1]}%止盈 · +${match[2]}%启用移动回撤${match[3]}% · 最长${hold} · ${stop}`;
}
function noEntryReasons(r){
  const reasons=[];
  if(metric(r.noCausalEntryQuote)>0)reasons.push(`无后续报价 ${r.noCausalEntryQuote}`);
  if(metric(r.insufficientRoundTripLiquidity)>0)reasons.push(`容量不足 ${r.insufficientRoundTripLiquidity}`);
  if(metric(r.roundTripCostTooHigh)>0)reasons.push(`往返成本过高 ${r.roundTripCostTooHigh}`);
  if(metric(r.invalidatedBeforeEntry)>0)reasons.push(`入场前失效 ${r.invalidatedBeforeEntry}`);
  return reasons.length?reasons.join(' · '):'—';
}
function noExitReasons(r){
  const reasons=[];
  if(metric(r.noExitQuote)>0)reasons.push(`无退出报价 ${r.noExitQuote}`);
  if(metric(r.noTradeAfterHorizon)>0)reasons.push(`时间后无交易 ${r.noTradeAfterHorizon}`);
  if(metric(r.noExitOther)>0)reasons.push(`其他 ${r.noExitOther}`);
  return reasons.length?reasons.join(' · '):'—';
}
function combinedScenario(rows,lossPct,tipSol){
  const row=(rows||[]).find(item=>Number(item.noExitLossPct)===Number(lossPct)&&Number(item.tipSol)===Number(tipSol));
  return row?.averageNetReturnPct??null;
}
function renderStrategies(){
  const rows=[...state.cohorts].sort(compareCohorts);
  const totalPages=pageCount(rows.length);
  state.strategyPage=Math.min(Math.max(1,state.strategyPage),totalPages);
  const start=(state.strategyPage-1)*PAGE_SIZE;
  const visible=rows.slice(start,start+PAGE_SIZE);
  const body=visible.length?visible.map((r,index)=>{
    const resolved=r.resolvedEpisodes??r.resolved??0;
    const sample=resolved<30?'<span class="sample">样本不足</span>':'';
    const fullLoss=combinedScenario(r.combinedScenarios,-100,0);
    const raw=`${r.recoveryProfileId}/${r.entryVariantId}/${r.exitProfileId}`;
    return `<tr><td title="${html(raw)}"><span class="rank">#${start+index+1}</span><code>${html(signalLabel(r.recoveryProfileId))}</code>${sample}</td>${cell(entryLabel(r.entryVariantId))}${cell(exitLabel(r.exitProfileId))}${cell(`${fmt(r.positionSol,0)} SOL`)}${cell(resolved)}${cell(pct(r.entryFillRatePct))}${cell(pct(r.exitFillRatePct))}${cell(pct(r.winRatePct),metric(r.winRatePct)>0?'good':'')}${cell(pct(r.averageNetReturnPct),metric(r.averageNetReturnPct)>0?'good':metric(r.averageNetReturnPct)<0?'bad':'')}${cell(pct(r.medianNetReturnPct))}${cell(noEntryReasons(r))}${cell(noExitReasons(r))}${cell(pct(fullLoss),metric(fullLoss)>0?'good':metric(fullLoss)<0?'bad':'')}${cell(fmt(r.profitFactor))}${cell(pct(r.worst5PctAverage),'bad')}</tr>`;
  }).join(''):'<tr><td class="empty" colspan="15">暂无达标砸单策略数据</td></tr>';
  document.querySelector('#strategies').innerHTML='<tr><th>排名 / 砸单桶</th><th>入场</th><th>退出管理</th><th>仓位</th><th>独立已结束事件</th><th>入场率</th><th>退出率</th><th>胜率</th><th>平均净收益</th><th>中位净收益</th><th>NO_ENTRY原因</th><th>NO_EXIT原因</th><th>NO_EXIT全损均值</th><th>PF</th><th>最差5%</th></tr>'+body;
  pager('#strategy-pager','strategy',state.strategyPage,totalPages,rows.length);
}
function renderDumps(result){
  state.dumpPage=result.page;
  const body=result.items.length?result.items.map(r=>`<tr><td>${html(time(r.detected_at_ms))} · ${mintLink(r.mint)}</td>${cell(signalLabel(r.signal_profile_id))}${cell(fmt(r.sell_sol,3))}${cell(pct(r.drop_pct),'bad')}${cell(pct(r.sell_to_quote_pct))}${cell(fmt(r.post_quote_sol,2))}${cell(`${r.slot??'?'} / Tx ${r.transaction_index??'?'}`)}${cell(r.status,'good')}</tr>`).join(''):'<tr><td class="empty" colspan="8">暂无达到5 SOL和8%双门槛的砸单</td></tr>';
  document.querySelector('#dumps').innerHTML='<tr><th>时间 / 合约地址</th><th>信号桶</th><th>砸单SOL</th><th>冲击跌幅</th><th>Sell/Reserve</th><th>卖后Quote</th><th>Slot / 位置</th><th>状态</th></tr>'+body;
  pager('#dump-pager','dump',result.page,result.totalPages,result.total);
}
function changePage(kind,page){
  if(kind==='strategy'){
    state.strategyPage=page;
    renderStrategies();
    return;
  }
  state.dumpPage=page;
  refresh();
}
async function fetchJson(url,timeoutMs=8000){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),timeoutMs);
  try{
    const response=await fetch(url,{signal:controller.signal});
    if(!response.ok)throw new Error(`${url} HTTP ${response.status}`);
    return await response.json();
  }finally{clearTimeout(timer)}
}
async function refresh(){
  if(refreshInFlight){refreshQueued=true;return}
  refreshInFlight=true;
  try{
    const [summaryResult,dumpResult,healthResult]=await Promise.allSettled([
      fetchJson('/api/summary'),
      fetchJson(`/api/direct-dumps?page=${state.dumpPage}&pageSize=${PAGE_SIZE}`),
      fetchJson('/api/health'),
    ]);
    const failed=[summaryResult,dumpResult,healthResult].filter(result=>result.status==='rejected').length;
    const health=healthResult.status==='fulfilled'?healthResult.value:{};
    const stream=health.stream||{};
    document.querySelector('#status').textContent=healthResult.status==='fulfilled'
      ?`研究模式 · ${stream.state||'运行中'} · ${health.runtime?.status||'CHECKING'}${failed?` · ${failed}项暂不可用`:''}`
      :`研究模式 · 健康状态暂不可用${failed?` · ${failed}项读取失败`:''}`;
    if(summaryResult.status==='fulfilled'){
      const summary=summaryResult.value;
      const matrix=summary.directDumpMatrix||{};
      const pool=health.poolResolver||{};
      const cards=[
        ['Helius采集',stream.receivesFullTransactionMetadata===false?'轻量日志+排序':'完整交易'],
        ['日志/排序合并率',stream.logStatusJoinRatePct==null?'—':pct(stream.logStatusJoinRatePct)],
        ['全网卖出事件',summary.dumps?.independent??0],
        ['达标砸单',matrix.qualifiedEvents??0],
        ['运行中策略仓位',matrix.active??0],
        ['已退出组合',matrix.closed??0],
        ['策略入场率',pct(matrix.entryFillRatePct)],
        ['已退出胜率',pct(matrix.winRatePct)],
        ['平均净收益',pct(matrix.averageNetReturnPct)],
        ['固定单仓','1 SOL'],
        ['已出现矩阵单元',`${matrix.observedCohorts??0} / ${matrix.totalMatrixCells??432}`],
        ['新池RPC补全',pool.rpcCalls??0],
      ];
      document.querySelector('#cards').innerHTML=cards.map(([a,b])=>`<div class="card"><div class="label">${a}</div><div class="value">${b??'—'}</div></div>`).join('');
      const notices=[];
      notices.push('<strong>唯一研究方向：</strong>只监控迁移后的PumpSwap；不限制AGE，砸单≥5 SOL且单次冲击跌幅≥8%才创建策略仓位');
      notices.push('<strong>分桶：</strong>砸单规模5–10、10–25、≥25 SOL × 跌幅8–15%、15–30%、≥30%，共9个信号桶');
      notices.push('<strong>独立加仓：</strong>每次达标砸单都新建独立1 SOL仓位；已有仓位不会被覆盖，每个仓位单独计算入场和退出');
      notices.push('<strong>入场矩阵：</strong>紧跟砸单后的首个可成交公开报价、延迟100ms、延迟300ms；砸单本身不能作为E0成交价');
      notices.push('<strong>退出矩阵：</strong>买入后5秒内+3%/+5%快速止盈，+2%回撤1%或+4%回撤2%的移动止盈，最长30秒/5分钟，并对比无固定止损与-12%止损');
      notices.push('<strong>规模：</strong>每个达标砸单测试48个入场×退出组合，9个信号桶合计432个矩阵单元；参数组合数不能当成独立事件数');
      notices.push('<strong>成本：</strong>直接矩阵默认单边基础费0.000005 SOL、优先费0.0001 SOL、Jito 0；仍计PumpSwap费率和滑点');
      notices.push('<strong>安全边界：</strong>当前仅研究模拟，不读取实盘私钥、不发送交易；Dashboard收益不是实盘成交证明');
      if(metric(matrix.qualifiedEvents)<30)notices.push(`<span class="warning">当前达标独立砸单仅 ${matrix.qualifiedEvents??0} 个，任何胜率和收益都属于小样本</span>`);
      if(stream.receivesFullTransactionMetadata===false&&metric(stream.logStatusJoinRatePct)<95)notices.push(`<span class="warning">日志/排序合并率当前为 ${pct(stream.logStatusJoinRatePct)}，持续偏低时不要据此判断策略</span>`);
      document.querySelector('#research-notice').innerHTML=notices.join(' · ');
      state.cohorts=(summary.directDumpCohorts||[]).filter(row=>row.quoteModel==='PUMPSWAP_DIRECT_DUMP_MANAGED_V1');
      renderStrategies();
    }
    if(dumpResult.status==='fulfilled')renderDumps(dumpResult.value);
  }catch(error){document.querySelector('#status').textContent=`读取失败: ${error.message}`}
  finally{
    refreshInFlight=false;
    if(refreshQueued){refreshQueued=false;setTimeout(refresh,0)}
  }
}
refresh();
setInterval(refresh,10000);
</script>
</body>
</html>
